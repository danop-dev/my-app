name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger

jobs:
  deploy:
    name: Deploy via Tailscale SSH
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Connect runner to Tailscale network ──────────────────────────────
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      # ── 2. SSH into server and deploy ───────────────────────────────────────
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 300s
          script: |
            set -e

            APP_DIR="$HOME/projects/my-app"

            # ── pull latest code ──────────────────────────────────────────────
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            # ── rebuild & restart only changed containers (zero-downtime-ish) ─
            docker compose pull --quiet 2>/dev/null || true
            docker compose up -d --build --remove-orphans

            # ── prune old images to save disk space ───────────────────────────
            docker image prune -f

            echo "✅ Deployment complete"

      # ── 3. Verify health (optional but helpful) ─────────────────────────────
      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "--- Container status ---"
            docker compose -f "$HOME/projects/my-app/docker-compose.yml" ps
